{% extends "base.html" %}
{% block title %}{{ t('reset.title') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto;">
  <h1>{{ t('reset.title') }}</h1>
  <p class="muted">{{ t('reset.intro') }}</p>

  <form method="post">
    <label>{{ t('reg.username') }}</label>
    <input name="username" type="text" required autofocus
           value="{{ username or '' }}">

    <label style="margin-top:14px;">{{ t('reset.new_password') }}</label>
    <input name="password" type="password" required
           placeholder="{{ t('reg.password_hint') }}">

    <label style="margin-top:14px;">{{ t('reg.password2') }}</label>
    <input name="password2" type="password" required>

    <div style="margin-top:20px;">
      <button class="btn" type="submit">{{ t('reset.submit') }}</button>
      <a href="{{ url_for('login') }}" class="btn secondary">{{ t('reset.back') }}</a>
    </div>
  </form>
</div>
{% endblock %}
